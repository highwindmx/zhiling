<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>知灵桌宠 · 设置</title>
<link rel="stylesheet" href="./base.css">
<style>
  header{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);
         background:linear-gradient(180deg,#20222a,#1a1c22)}
  header h1{font-size:14px;font-weight:600;white-space:nowrap}
  .grow{flex:1}
  select,input[type=text]{padding:4px 8px}
  button.ghost{background:transparent}
  button.mini{padding:2px 7px;font-size:12px;border-radius:6px}
  .tabs{display:flex;gap:4px;flex:none}
  .tab{background:transparent;border:1px solid transparent;border-radius:7px;padding:5px 12px;color:var(--dim)}
  .tab:hover{background:#262a34;color:var(--txt);border-color:var(--line)}
  .tab.on{background:#232a40;border-color:var(--accent);color:var(--txt)}
  .hdr-ops{display:flex;gap:6px;flex:none}
  header{flex-wrap:nowrap}
  #status{color:var(--dim);font-size:12px;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
  #status.ok{color:var(--ok)} #status.err{color:var(--err)} #status.warn{color:var(--warn)}
  .pane{flex:1;min-height:0}
  .pane[hidden]{display:none!important}
  .forms{flex:1;overflow:auto;padding:10px 14px 12px;display:flex;flex-direction:column;gap:10px;width:100%}
  /* 只有超宽窗口才居中限宽，普通窗口铺满内容区，避免右侧大片留白 */
  @media (min-width:1400px){ .forms{max-width:1400px;margin:0 auto} }
  .card .line{display:flex;align-items:center;gap:10px;padding:3px 0;font-size:12px;color:var(--dim)}
  .card .line .k{width:96px;color:var(--txt);flex:none}
  .card .line .v{color:var(--dim);word-break:break-all}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6b7280;margin-right:6px;vertical-align:middle}
  .dot.on{background:#22c55e}
  .dot.warn{background:#eab308}
  .dot.off{background:#ef4444}
  input[type=number]{width:80px}
  #pane-states{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:8px 14px 10px}
  #pane-states > .grid{flex:1;display:grid;grid-template-columns:360px 1fr;gap:10px;min-height:0}
  .state-top{display:flex;align-items:center;gap:8px;padding:5px 10px;
             background:var(--panel);border:1px solid var(--line);border-radius:9px}
  .state-top b{font-size:13px}
  #pane-alert{display:flex;flex-direction:column;min-height:0}
  /* 「素材与工具」压成单行：目录 + 来源 + 校验状态 + 两个按钮 */
  .tools{display:flex;align-items:center;gap:8px;padding:5px 9px;font-size:12px;color:var(--dim);
         background:var(--panel);border:1px solid var(--line);border-radius:9px;flex:none}
  .tools .k{color:var(--txt);flex:none}
  .tools input[type=text]{font-size:12px;padding:3px 8px}
  .tools .v{flex:none;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tools #packsMsg{max-width:300px}
  .tools .v.ok{color:var(--ok)} .tools .v.err{color:var(--err)}
  .tag{font-size:11px;padding:1px 7px;border-radius:5px;background:#2b2e38;color:var(--dim);flex:none}
  .hr{height:1px;background:var(--line);margin:6px 0}
  .col{display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .col-h,.pool-h{display:flex;align-items:center;gap:7px;padding:6px 9px;border-bottom:1px solid var(--line);
                 color:var(--dim);font-size:12px;min-width:0}
  .pool-h{flex:none}
  .col-h b,.pool-h b{color:var(--txt);font-size:13px;white-space:nowrap;flex:none}
  /* 提醒态常驻 + 重置排序：同一行同一组，勾选框在按钮左侧，不另起一行 */
  .col-h .hold{display:inline-flex;align-items:center;gap:5px;color:var(--txt);font-size:12px;
               cursor:pointer;white-space:nowrap;flex:none}
  .list{overflow:auto;padding:4px}
  .state{display:flex;align-items:center;gap:6px;padding:2px 5px;border-radius:7px;border:1px solid transparent;
         cursor:pointer;margin-bottom:1px;background:#20222a}
  .state:hover{background:#262a34}
  .state.sel{border-color:var(--accent);background:#232a40}
  .state.drag{opacity:.45}
  .state.over{border-top:2px solid var(--accent)}
  .handle{color:#6d7380;cursor:grab;font-size:13px;letter-spacing:1px;user-select:none}
  .thumb{width:24px;height:24px;border-radius:5px;background:#111216;object-fit:contain;flex:none}
  .state .mid{flex:1;min-width:0}
  .state .nm{font-weight:600;font-size:12px;line-height:1.3}
  .state .sub{color:var(--dim);font-size:10.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .state .ops{display:flex;gap:2px;opacity:.65}
  .state .mini{padding:0 5px;font-size:11px}
  input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;flex:none}
  .right{overflow:hidden;padding:9px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
  .hint{color:var(--dim);font-size:11.5px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 9px}
  .card h3{font-size:12.5px;margin-bottom:5px;display:flex;align-items:center;gap:7px}
  .card h3 .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 动作池横排：状态名（左）｜池（弹性宽度）｜两个按钮（右）都在同一行 */
  .pool{flex:1;min-width:0;display:flex;align-items:center;gap:5px;overflow-x:auto;overflow-y:hidden;padding:2px 0}
  .clip{flex:none;display:flex;align-items:center;gap:4px;padding:2px 4px;border-radius:6px;
        background:#1b1d23;border:1px solid #2b2e37}
  .clip .nm{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:112px}
  .clip .idx{color:var(--dim);font-size:10.5px;width:11px;text-align:right;flex:none}
  .clip .thumb{width:26px;height:26px}
  .clip .mini{padding:1px 4px;font-size:11px;line-height:1.35;border-radius:4px}
  .clip.sel{border-color:var(--accent)}
  .empty{color:var(--dim);font-size:12px;padding:2px}
  .preview-wrap{display:flex;flex-direction:column;gap:5px;flex:1;min-height:0}
  .stage{background:#0e0f13;border:1px solid var(--line);border-radius:9px;flex:1;min-height:0;max-height:330px;display:flex;
         align-items:center;justify-content:center;overflow:hidden}
  .stage canvas{max-width:100%;max-height:100%;object-fit:contain}
  .pv-bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
  .pv-bar .grow{}
  .row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim)}
  .row label{display:flex;align-items:center;gap:6px;color:var(--txt);cursor:pointer}
  .modal{position:fixed;inset:0;background:rgba(8,9,12,.72);display:none;align-items:center;justify-content:center;z-index:20}
  .modal.show{display:flex}
  .modal-box{width:min(720px,92vw);max-height:82vh;display:flex;flex-direction:column;background:var(--panel);
             border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .modal-h{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
  .modal-h b{flex:1}
  .modal-list{overflow:auto;padding:8px;display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
  .modal-list label{display:flex;align-items:center;gap:9px;padding:6px;border-radius:8px;background:#1f2129;cursor:pointer}
  .modal-list label:hover{background:#272b35}
  .modal-list .nm{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .modal-f{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line)}
  .rename{position:fixed;inset:0;background:rgba(8,9,12,.72);display:none;align-items:center;justify-content:center;z-index:21}
  .rename.show{display:flex}
  .rename-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;width:360px;display:flex;flex-direction:column;gap:10px}
  .rename-box input{width:100%}
  .rename-box .f{display:flex;justify-content:flex-end;gap:8px}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#3a3e48;border-radius:5px}
</style>
</head>
<body>
<header>
  <h1>桌宠设置</h1>
  <nav class="tabs" id="tabs">
    <button class="tab on" data-tab="pane-states">状态与动画</button>
    <button class="tab" data-tab="pane-alert">提醒与连接</button>
  </nav>
  <div class="hdr-ops">
    <button id="saveBtn" class="primary" disabled title="把当前改动写回主题 JSON 与配置（写前覆盖备份）">保存配置</button>
    <button id="restoreBtn" title="读取上次保存的配置备份并回填到界面，点「保存配置」才真正写入">恢复上次配置</button>
    <button id="closeBtn" class="ghost" title="放弃未保存的改动并关闭">取消</button>
  </div>
  <div class="grow"></div>
  <span id="status"></span>
</header>

<section class="pane" id="pane-states">
  <div class="state-top">
    <b>主题</b>
    <select id="themeSel" title="先选主题，再看/改该主题的状态绑定（切换后立即生效）"></select>
    <button class="mini" id="renameTheme" title="重命名当前主题">重命名…</button>
    <button class="mini" id="newTheme" title="新建一个主题">新建主题…</button>
  </div>
  <div class="grid">
  <section class="col">
    <div class="col-h">
      <b>状态与动画</b>
      <div class="grow"></div>
      <label class="hold" title="完成 / 出错 / 待你决策 未点击时持续播放，不回 idle">
        <input type="checkbox" id="remindHold" /> 提醒态常驻
      </label>
      <button class="mini ghost" id="resetOrder" title="恢复默认优先级">重置排序</button>
    </div>
    <div class="list" id="stateList"></div>
  </section>

  <section class="col">
    <div class="pool-h">
      <b id="stateTitle">—</b>
      <span class="hint" id="poolCount"></span>
      <div class="pool" id="pool"></div>
      <button class="mini" id="addClip" title="从动作库添加已生成的动画">+ 动作库</button>
      <button class="mini" id="newClip" title="在素材工坊新建动画">新建动画</button>
    </div>

    <div class="right">
      <div class="card preview-wrap">
        <h3>单段预览 <span class="hint" id="pvInfo">选择动作池里的一段</span></h3>
        <div class="stage"><canvas id="pvCanvas"></canvas></div>
        <div class="pv-bar">
          <button class="mini" id="pvPlay" disabled>播放</button>
          <span id="pvFrame">—</span>
          <div class="grow"></div>
          <button class="mini" id="pvWorkshop" disabled>在工坊中打开</button>
        </div>
      </div>
    </div>
  </section>
  </div>

  <div class="tools" title="素材目录：可直接输入/粘贴绝对路径，或使用 %LOCALAPPDATA% 等环境变量（保存时展开）；留空 = 按默认顺序解析">
    <span class="k">素材</span>
    <input type="text" id="packsDir" style="flex:1;min-width:120px" spellcheck="false"
           placeholder="留空 = 按默认顺序解析（%LOCALAPPDATA%\DeskPet\packs）"
           title="可直接输入或粘贴绝对路径；支持 %LOCALAPPDATA% / %APPDATA% / %USERPROFILE% / %TEMP% 变量（保存时展开为绝对路径）；留空 = 按默认顺序解析" />
    <span class="tag" id="packsSrc" title="来源：默认 / 配置 / 环境变量">—</span>
    <span class="v err" id="packsMsg" hidden></span>
    <span class="v" id="packsState">—</span>
    <button class="mini" id="pickPacks">浏览…</button>
    <button class="mini" id="openPacks" title="用系统资源管理器打开当前生效的素材目录">打开目录</button>
    <button class="mini" id="resetPacks" title="清空自定义路径，回到 %LOCALAPPDATA%\DeskPet\packs（按默认顺序解析）">恢复默认</button>
  </div>
</section>

<section class="pane" id="pane-alert" hidden>
  <div class="forms">
    <div class="card">
      <h3>番茄钟</h3>
      <div class="line" title="托盘菜单「番茄钟」开始 / 暂停 / 停止">
        <span class="k">总开关</span>
        <label class="row"><input type="checkbox" id="pomoEnabled" /> 启用</label>
      </div>
      <div class="line" title="默认 25 分钟">
        <span class="k">专注时长</span>
        <input type="number" id="pomoWork" min="1" max="180" step="1" />
        <span class="v">分钟</span>
      </div>
      <div class="line" title="默认 5 分钟">
        <span class="k">休息时长</span>
        <input type="number" id="pomoBreak" min="1" max="60" step="1" />
        <span class="v">分钟</span>
      </div>
      <div class="line"><span class="k">当前</span><span class="v" id="pomoNow">—</span></div>
      <div class="line" title="专注=focus（未绑定回落 busy），休息=focus_break（未绑定回落 idle）">
        <span class="k">动画映射</span><span class="v"><code>focus</code> / <code>focus_break</code></span>
      </div>
    </div>
    <div class="card">
      <h3>连接</h3>
      <div class="line" title="直接订阅 DSH 插件在 127.0.0.1 的 WebSocket 广播（只读，不回写）">
        <span class="k">DSH 状态</span>
        <span class="v"><span class="dot" id="dshDot"></span><span id="dshState">—</span></span>
      </div>
      <div class="line"><span class="k">DSH 地址</span><span class="v" id="dshUrl">—</span></div>
      <div class="line"><span class="k">最近事件</span><span class="v" id="dshLast">—</span></div>
      <div class="line" title="DSH 插件广播端口（默认 55471；0 = 关闭订阅）">
        <span class="k">DSH 端口</span>
        <input type="number" id="dshPort" min="0" max="65535" step="1" style="width:96px" />
        <span class="v">默认 55471</span>
        <button class="mini" id="dshRecheck">重新检测</button>
        <span class="v" id="dshMsg">—</span>
      </div>
      <div class="hr"></div>
      <div class="line" title="对外 HTTP 状态入口（POST/GET /state）；端口保存后重启桌宠生效">
        <span class="k">HTTP 入口</span>
        <span class="v" id="stateUrl">—</span>
        <input type="number" id="statePort" min="0" max="65535" step="1" style="width:96px" />
        <button class="mini" id="copyState">复制</button>
        <span class="v" id="stateLast">—</span>
      </div>
    </div>
  </div>
</section>

<div class="modal" id="libModal">
  <div class="modal-box">
    <div class="modal-h"><b>从动作库添加</b><span class="hint" id="libHint"></span><button class="mini ghost" id="libClose">关闭</button></div>
    <div class="modal-list" id="libList"></div>
    <div class="modal-f"><button id="libCancel" class="ghost">取消</button><button id="libAdd" class="primary">添加所选</button></div>
  </div>
</div>

<div class="rename" id="renameModal">
  <div class="rename-box">
    <b>重命名主题</b>
    <input type="text" id="renameInput" maxlength="40" />
    <div class="f"><button class="ghost" id="renameCancel">取消</button><button class="primary" id="renameOk">确定</button></div>
  </div>
</div>

<script type="module" src="./src/settings.js"></script>
</body>
</html>
